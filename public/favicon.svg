    <rect x="6" y="12" width="9" height="1.5"/>
    <rect x="6" y="15" width="9" height="1.5"/>
    <rect x="6" y="18" width="9" height="1.5"/>
    <rect x="6" y="21" width="6" height="1.5"/>
    <rect x="17" y="12" width="9" height="1.5"/>
    <rect x="17" y="15" width="9" height="1.5"/>
    <rect x="17" y="18" width="9" height="1.5"/>
    <rect x="17" y="21" width="4" height="1.5"/>
  </g>
</svg>
